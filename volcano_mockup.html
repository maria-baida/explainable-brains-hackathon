<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Brain Data Explorer</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f0f0; color: #111; }

/* ── Header ── */
.header {
  background: #111827;
  color: white;
  padding: 0 20px;
  height: 48px;
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid #1f2937;
}
.header-icon { font-size: 20px; }
.header-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
.header-sub { font-size: 12px; color: #6b7280; margin-left: 4px; }
.header-sep { color: #374151; margin: 0 4px; }

/* ── Layout ── */
.layout { display: flex; height: calc(100vh - 48px); }

/* ── Sidebar ── */
.sidebar {
  width: 240px;
  min-width: 240px;
  background: white;
  border-right: 1px solid #e5e7eb;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.sidebar-section {
  padding: 14px 16px 10px;
  border-bottom: 1px solid #f3f4f6;
}

.section-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #6b7280;
  margin-bottom: 10px;
}

/* Toggle row */
.toggle-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 0;
  cursor: pointer;
  user-select: none;
}
.toggle-label-text {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: #374151;
}
.legend-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.dot-sig   { background: #e05c5c; }
.dot-unsig { background: #94a3b8; }

/* Felt-style toggle */
.toggle { position: relative; width: 32px; height: 18px; flex-shrink: 0; }
.toggle input { opacity: 0; width: 0; height: 0; position: absolute; }
.toggle-track {
  position: absolute; inset: 0;
  background: #d1d5db; border-radius: 18px; transition: background .15s; cursor: pointer;
}
.toggle-thumb {
  position: absolute;
  width: 12px; height: 12px;
  background: white; border-radius: 50%;
  top: 3px; left: 3px;
  transition: transform .15s;
  pointer-events: none;
}
.toggle input:checked ~ .toggle-track { background: #111827; }
.toggle input:checked ~ .toggle-track .toggle-thumb { transform: translateX(14px); }

/* Pill buttons */
.pill-row { display: flex; gap: 4px; flex-wrap: wrap; }
.pill {
  padding: 4px 10px; border-radius: 4px; font-size: 11px; font-weight: 500;
  cursor: pointer; border: 1px solid #e5e7eb; background: white;
  color: #374151; transition: all .12s; line-height: 1.4;
}
.pill:hover { border-color: #9ca3af; }
.pill.active { background: #111827; color: white; border-color: #111827; }

/* Sliders */
.slider-group { margin-bottom: 10px; }
.slider-group:last-child { margin-bottom: 0; }
.slider-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 5px; }
.slider-lbl { font-size: 11px; color: #374151; }
.slider-val { font-size: 11px; font-weight: 600; color: #111827; }
input[type=range] {
  width: 100%; height: 4px; accent-color: #111827;
  -webkit-appearance: none; appearance: none;
  background: #e5e7eb; border-radius: 4px; outline: none;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 14px; height: 14px;
  border-radius: 50%; background: #111827; cursor: pointer;
}

/* Search */
.search-box {
  width: 100%; padding: 7px 10px;
  border: 1px solid #e5e7eb; border-radius: 5px;
  font-size: 12px; color: #111827; outline: none;
  transition: border .12s;
}
.search-box:focus { border-color: #9ca3af; }
.search-box::placeholder { color: #9ca3af; }

/* ── Main ── */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; background: white; }
#volcano { flex: 1; min-height: 0; }

/* ── Stats bar ── */
.stats-bar {
  background: white;
  border-top: 1px solid #e5e7eb;
  padding: 10px 20px;
  display: flex;
  gap: 28px;
}
.stat-item { display: flex; flex-direction: column; }
.stat-val { font-size: 18px; font-weight: 700; color: #111827; line-height: 1.2; }
.stat-lbl { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .05em; color: #9ca3af; margin-top: 1px; }

/* ── Tooltip ── */
#tooltip {
  position: fixed; pointer-events: none;
  background: white; border: 1px solid #e5e7eb;
  border-radius: 6px; padding: 10px 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,.10);
  font-size: 11.5px; max-width: 240px; z-index: 1000;
  display: none; line-height: 1.55;
}
#tooltip .tt-name { font-weight: 700; font-size: 12.5px; color: #111827; margin-bottom: 4px; }
#tooltip .tt-acr {
  display: inline-block; background: #f3f4f6; color: #374151;
  border-radius: 3px; padding: 1px 5px; font-size: 10px;
  font-weight: 700; font-family: monospace; margin-bottom: 6px;
}
#tooltip .tt-divider { border: none; border-top: 1px solid #f3f4f6; margin: 6px 0; }
#tooltip .tt-row { display: flex; justify-content: space-between; gap: 12px; padding: 1px 0; }
#tooltip .tt-key { color: #6b7280; }
#tooltip .tt-val { font-weight: 600; color: #111827; }
#tooltip .tt-badge {
  margin-top: 5px; padding: 2px 7px; border-radius: 3px;
  font-size: 10.5px; font-weight: 700; display: inline-block;
}
#tooltip .badge-sig   { background: #fef2f2; color: #dc2626; }
#tooltip .badge-unsig { background: #f9fafb; color: #6b7280; }
</style>
</head>
<body>

<div class="header">
  <span class="header-icon">🧠</span>
  <span class="header-title">Brain Data Explorer</span>
  <span class="header-sep">·</span>
  <span class="header-sub">c-Fos · Semaglutide vs Vehicle · Mouse brain</span>
</div>

<div class="layout">
  <div class="sidebar">

    <div class="sidebar-section">
      <div class="section-label">Visibility</div>
      <label class="toggle-row" id="row-unsig">
        <span class="toggle-label-text">
          <span class="legend-dot dot-unsig"></span>
          Not significant
        </span>
        <label class="toggle">
          <input type="checkbox" id="show-unsig" checked>
          <span class="toggle-track"><span class="toggle-thumb"></span></span>
        </label>
      </label>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Labels</div>
      <div class="pill-row">
        <button class="pill active" data-mode="sig">Significant</button>
        <button class="pill" data-mode="top10">Top 10 FC</button>
        <button class="pill" data-mode="none">None</button>
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Thresholds</div>
      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-lbl">p-value cutoff</span>
          <span class="slider-val" id="p-thresh-val">p &lt; 0.05</span>
        </div>
        <input type="range" id="p-thresh" min="1" max="5" step="0.5" value="1.301">
      </div>
      <div class="slider-group">
        <div class="slider-header">
          <span class="slider-lbl">|log&#x2082;FC| cutoff</span>
          <span class="slider-val" id="fc-thresh-val">&#x2265; 1.0&#xd7;</span>
        </div>
        <input type="range" id="fc-thresh" min="0" max="2" step="0.1" value="0">
      </div>
    </div>

    <div class="sidebar-section">
      <div class="section-label">Search region</div>
      <input type="text" class="search-box" id="search" placeholder="e.g. NTS, hypothalamus…">
    </div>

  </div>

  <div class="main">
    <div id="volcano"></div>
    <div class="stats-bar">
      <div class="stat-item">
        <span class="stat-val" id="stat-total">—</span>
        <span class="stat-lbl">Regions</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-sig" style="color:#e05c5c">—</span>
        <span class="stat-lbl">Significant</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-up" style="color:#16a34a">—</span>
        <span class="stat-lbl">Upregulated</span>
      </div>
      <div class="stat-item">
        <span class="stat-val" id="stat-down" style="color:#2563eb">—</span>
        <span class="stat-lbl">Downregulated</span>
      </div>
    </div>
  </div>
</div>

<div id="tooltip"></div>

  const search = state.search.toLowerCase();
  const isSearched = d => search.length > 1 && (
    d.acronym.toLowerCase().includes(search) ||
    d.region_name.toLowerCase().includes(search)
  );

  const sigPts   = allData.filter(d => isSig(d));
  const unsigPts = state.showUnsig ? allData.filter(d => !isSig(d)) : [];

  let labelPts = [];
  if (state.labelMode === 'sig') labelPts = sigPts;
  else if (state.labelMode === 'top10') {
    labelPts = [...allData].sort((a,b) => Math.abs(b.log2_fold_change) - Math.abs(a.log2_fold_change)).slice(0,10);
  }

  function makeTrace(pts, name, baseColor, size, opacity) {
    return {
      x: pts.map(d => d.log2_fold_change),
      y: pts.map(d => d.neg_log10_p),
      mode: 'markers', type: 'scatter', name,
      marker: {
        color:   pts.map(d => isSearched(d) ? '#f59e0b' : baseColor),
        size:    pts.map(d => isSearched(d) ? 13 : size),
        opacity,
        line: { width: pts.map(d => isSearched(d) ? 1.5 : 0), color: '#f59e0b' },
      },
      customdata: pts.map(d => [
        d.region_name, d.acronym, d.log2_fold_change, d.p_value, d.p_corrected,
        d.fold_change, d.mean_A, d.mean_B, d.n_A_eff, d.n_B_eff, d.significant_uncorrected
      ]),
      hoverinfo: 'none',
    };
  }

  const traces = [
    makeTrace(unsigPts, 'Not significant',      '#94a3b8', 6,  0.5),
    makeTrace(sigPts,   'Significant (p<0.05)', '#e05c5c', 9,  0.9),
  ];

  const annotations = labelPts.map(d => ({
    x: d.log2_fold_change, y: d.neg_log10_p,
    text: d.acronym, showarrow: false,
    font: { size: 9.5, color: '#111827', family: 'monospace' },
    xshift: d.log2_fold_change > 0 ? 11 : -11,
    yshift: 3,
    xanchor: d.log2_fold_change > 0 ? 'left' : 'right',
  }));

  const layout = {
    xaxis: {
      title: { text: 'log₂ Fold Change (Semaglutide / Vehicle)', font: { size: 12, color: '#374151' } },
      zeroline: true, zerolinecolor: '#9ca3af', zerolinewidth: 1,
      gridcolor: '#f3f4f6', tickfont: { size: 11, color: '#6b7280' },
    },
    yaxis: {
      title: { text: '−log₁₀(p value)', font: { size: 12, color: '#374151' } },
      gridcolor: '#f3f4f6', tickfont: { size: 11, color: '#6b7280' },
    },
    paper_bgcolor: 'white', plot_bgcolor: 'white',
    legend: { orientation: 'h', y: -0.14, x: 0.5, xanchor: 'center', font: { size: 11, color: '#374151' } },
    margin: { t: 20, r: 20, b: 56, l: 56 },
    annotations,
    font: { family: '-apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif' },
    hovermode: 'closest',
  };

  Plotly.react('volcano', traces, layout, { responsive: true, displayModeBar: false });

  const shown = [...sigPts, ...unsigPts];
  document.getElementById('stat-total').textContent = shown.length;
  document.getElementById('stat-sig').textContent   = sigPts.length;
  document.getElementById('stat-up').textContent    = shown.filter(d => d.log2_fold_change > 0).length;
  document.getElementById('stat-down').textContent  = shown.filter(d => d.log2_fold_change < 0).length;
}

function init(data) {
  render(data);

  document.getElementById('volcano').on('plotly_hover', evt => {
    const pt = evt.points[0]; if (!pt) return;
    const [name, acr, lfc, pv, pvc, fc, mA, mB, nA, nB, sig] = pt.customdata;
    const tt = document.getElementById('tooltip');
    const up = lfc > 0;
    const dir = up ? '▲ Higher in Semaglutide' : '▼ Lower in Semaglutide';
    const dirCol = up ? '#dc2626' : '#2563eb';
    tt.innerHTML = `
      <div class="tt-name">${name}</div>
      <span class="tt-acr">${acr}</span>
      <hr class="tt-divider">
      <div class="tt-row"><span class="tt-key">log₂ FC</span><span class="tt-val" style="color:${dirCol}">${(+lfc).toFixed(3)}</span></div>
      <div class="tt-row"><span class="tt-key">Fold change</span><span class="tt-val">${(+fc).toFixed(3)}×</span></div>
      <div class="tt-row"><span class="tt-key">p value</span><span class="tt-val">${(+pv).toExponential(2)}</span></div>
      <div class="tt-row"><span class="tt-key">p corrected</span><span class="tt-val">${pvc == null ? 'N/A' : (+pvc).toExponential(2)}</span></div>
      <hr class="tt-divider">
      <div class="tt-row"><span class="tt-key">Mean G002 (Sema)</span><span class="tt-val">${(+mA).toFixed(1)}</span></div>
      <div class="tt-row"><span class="tt-key">Mean G001 (Vehicle)</span><span class="tt-val">${(+mB).toFixed(1)}</span></div>
      <div class="tt-row"><span class="tt-key">n (Sema / Vehicle)</span><span class="tt-val">${nA} / ${nB}</span></div>
      <span class="tt-badge ${sig ? 'badge-sig' : 'badge-unsig'}">${sig ? '✓ Significant (p < 0.05)' : 'Not significant'}</span>
      <div style="font-size:10.5px;color:${dirCol};margin-top:4px;font-weight:500">${dir}</div>
    `;
    tt.style.display = 'block';
  });

  document.getElementById('volcano').on('plotly_unhover', () => {
    document.getElementById('tooltip').style.display = 'none';
  });

  document.addEventListener('mousemove', e => {
    const tt = document.getElementById('tooltip');
    if (tt.style.display === 'none') return;
    const x = e.clientX + 16, y = e.clientY - 10;
    const w = tt.offsetWidth, h = tt.offsetHeight;
    tt.style.left = (x + w > window.innerWidth  ? x - w - 28 : x) + 'px';
    tt.style.top  = (y + h > window.innerHeight ? y - h      : y) + 'px';
  });

  document.getElementById('show-unsig').addEventListener('change', e => {
    state.showUnsig = e.target.checked; render(data);
  });

  document.querySelectorAll('.pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      state.labelMode = btn.dataset.mode;
      render(data);
    });
  });

  document.getElementById('p-thresh').addEventListener('input', e => {
    state.pThresh = parseFloat(e.target.value);
    const pRaw = Math.pow(10, -state.pThresh);
    document.getElementById('p-thresh-val').textContent = `p < ${pRaw.toFixed(3)}`;
    render(data);
  });

  document.getElementById('fc-thresh').addEventListener('input', e => {
    state.fcThresh = parseFloat(e.target.value);
    const fc = Math.pow(2, state.fcThresh).toFixed(2);
    document.getElementById('fc-thresh-val').textContent = `≥ ${fc}×`;
    render(data);
  });

  document.getElementById('search').addEventListener('input', e => {
    state.search = e.target.value; render(data);
  });
}

init(VOLCANO_DATA);
</script>
</body>
</html>
